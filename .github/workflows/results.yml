name: results
# Validates results files changed in a pull request (community submissions are data, not code).
on:
  pull_request:
    paths: ["results/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate changed results files
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'results/*.json' 'results/**/*.json')
          if [ -z "$files" ]; then echo "No results files changed."; exit 0; fi
          status=0
          for f in $files; do node scripts/validate-results.mjs "$f" || status=1; done
          exit $status
