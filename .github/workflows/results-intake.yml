name: results-intake
# A "results" issue (from the template, or mobile.html's Submit buttons) is validated and, if it passes, committed
# straight to results/community/ on main, then the issue is closed and the results page rebuilt. No PRs to merge:
# validation is the gate, and a bad file can be reverted. No servers, nothing scheduled.
on:
  issues:
    types: [opened, edited, labeled]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: results-intake-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'results') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Reads the issue from the event file; the body is untrusted and only ever parsed as JSON.
      - id: intake
        run: node scripts/intake.mjs
      - name: Ask for a fix
        if: steps.intake.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ steps.intake.outputs.comment }}
        run: gh issue comment ${{ github.event.issue.number }} --body "$COMMENT"
      - name: Commit to main
        if: steps.intake.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.intake.outputs.files }}
          DEVICE: ${{ steps.intake.outputs.device }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "2dbench results bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$FILES" | while IFS= read -r f; do [ -n "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            gh issue close "$ISSUE" --comment "These results are already in the dataset. Thank you!"
            exit 0
          fi
          git commit -m "Results: $DEVICE (#$ISSUE)"
          # Another submission may have landed meanwhile: rebase and retry.
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep $((i * 3)); done
          # Pushes made with this token don't trigger other workflows, so rebuild the results page explicitly.
          gh workflow run pages.yml --ref main
          gh issue close "$ISSUE" --comment "Thank you! Your results passed validation and are now in the dataset. They'll appear on the [community results page](https://debuffjp.github.io/2dbench/results.html) in a minute or two."
